<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>HeavenCityRP Twitch Stream Wrapper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: #000;
            overflow: hidden;
        }
        body, html, #player-container {
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div id="player-container"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const channel = (urlParams.get('channel') || 'random_gtv').trim();
        const muted = urlParams.get('muted') === 'true';

        // When loaded in FiveM DUI, host is heavencityrp.github.io
        const host = window.location.hostname || 'heavencityrp.github.io';

        // Twitch Parent security parameters
        const embedUrl = `https://player.twitch.tv/?channel=${encodeURIComponent(channel)}&parent=${encodeURIComponent(host)}&parent=localhost&parent=127.0.0.1&autoplay=true&muted=${muted}`;

        console.log("[Wrapper] Loading Twitch stream:", embedUrl);

        const container = document.getElementById('player-container');
        const iframe = document.createElement('iframe');
        iframe.src = embedUrl;
        iframe.setAttribute('allowfullscreen', 'true');
        iframe.setAttribute('scrolling', 'no');
        iframe.setAttribute('frameborder', '0');
        iframe.setAttribute('allow', 'autoplay; fullscreen; encrypted-media; picture-in-picture');

        container.appendChild(iframe);
    </script>
</body>
</html>
