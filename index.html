<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>HeavenCityRP Twitch Stream Wrapper</title>
    <!-- Twitch Interactive Player API -->
    <script src="https://player.twitch.tv/js/embed/v1.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: #000;
            overflow: hidden;
        }
        body, html, #player-container {
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100% !important;
            height: 100% !important;
            border: none !important;
            display: block !important;
        }
    </style>
</head>
<body>
    <div id="player-container"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const channel = (urlParams.get('channel') || 'asaulter98').trim();
        const initialVolume = parseInt(urlParams.get('volume') || '0', 10);
        const isInitiallyMuted = urlParams.get('muted') === 'true' || initialVolume <= 0;
        let currentQuality = (urlParams.get('quality') || '160p').trim().toLowerCase();

        // When loaded via CreateDui, top-level host is heavencityrp.github.io
        const host = window.location.hostname || 'heavencityrp.github.io';

        // Initialize Twitch Player via official JS API
        const options = {
            width: "100%",
            height: "100%",
            channel: channel,
            parent: [host, "localhost", "127.0.0.1"],
            autoplay: true,
            muted: isInitiallyMuted
        };

        let player = null;
        let hasQualityLocked = false;

        try {
            player = new Twitch.Player("player-container", options);
        } catch (err) {
            console.error("[Wrapper] Failed to initialize Twitch.Player:", err);
        }

        function getQualityIdentifier(q) {
            if (!q) return '';
            if (typeof q === 'string') return q;
            return q.group || q.name || '';
        }

        // Apply stream quality (forces 160p if configured, with robust fallbacks)
        function applyQuality(targetQuality) {
            if (!player || typeof player.getQualities !== 'function') return false;

            try {
                const qualities = player.getQualities();
                if (!qualities || qualities.length === 0) {
                    return false;
                }

                console.log("[Wrapper] Available stream qualities:", JSON.stringify(qualities));

                const qualityStrings = qualities.map(getQualityIdentifier).filter(s => s && s.length > 0);
                if (qualityStrings.length === 0) return false;

                const target = (targetQuality || currentQuality || "160p").trim().toLowerCase();
                let chosenQuality = null;

                if (target === "160p" || target === "lowest") {
                    // 1. Direct match for 160p (e.g., "160p30", "160p", "160p60")
                    chosenQuality = qualityStrings.find(s => s.toLowerCase().includes("160"));

                    // 2. Fallback to 360p if 160p is not generated by Twitch for this stream
                    if (!chosenQuality) {
                        chosenQuality = qualityStrings.find(s => s.toLowerCase().includes("360"));
                    }

                    // 3. Fallback to 480p
                    if (!chosenQuality) {
                        chosenQuality = qualityStrings.find(s => s.toLowerCase().includes("480"));
                    }

                    // 4. Fallback to lowest non-auto resolution
                    if (!chosenQuality) {
                        const candidates = qualityStrings.filter(s => s.toLowerCase() !== "auto");
                        if (candidates.length > 0) {
                            candidates.sort((a, b) => {
                                const numA = parseInt(a.replace(/\D/g, ''), 10) || 9999;
                                const numB = parseInt(b.replace(/\D/g, ''), 10) || 9999;
                                return numA - numB;
                            });
                            chosenQuality = candidates[0];
                        }
                    }
                } else if (target === "auto") {
                    chosenQuality = "auto";
                } else {
                    const targetNum = target.replace(/\D/g, '');
                    if (targetNum) {
                        chosenQuality = qualityStrings.find(s => s.toLowerCase().includes(targetNum));
                    }
                    if (!chosenQuality) {
                        chosenQuality = qualityStrings.find(s => s.toLowerCase().includes(target));
                    }
                }

                if (chosenQuality) {
                    player.setQuality(chosenQuality);
                    hasQualityLocked = true;
                    console.log("[Wrapper] Stream quality successfully locked to:", chosenQuality, "(Active player quality:", player.getQuality ? player.getQuality() : "N/A", ")");
                    return true;
                }
            } catch (e) {
                console.error("[Wrapper] Error setting quality:", e);
            }
            return false;
        }

        if (player) {
            // Volume initialization on READY
            player.addEventListener(Twitch.Player.READY, () => {
                console.log("[Wrapper] Twitch Player READY. Applying initial volume:", initialVolume);
                player.setVolume(initialVolume / 100);
                if (isInitiallyMuted) {
                    player.setMuted(true);
                } else {
                    player.setMuted(false);
                }
                applyQuality(currentQuality);
            });

            // Quality locking on PLAYING
            player.addEventListener(Twitch.Player.PLAYING, () => {
                console.log("[Wrapper] Twitch Player PLAYING. Enforcing quality:", currentQuality);
                applyQuality(currentQuality);
            });
        }

        // Periodic quality enforcement check during initial 25 seconds until locked
        let qualityChecks = 0;
        const qualityCheckTimer = setInterval(() => {
            qualityChecks++;
            if (hasQualityLocked || qualityChecks > 25) {
                if (hasQualityLocked) clearInterval(qualityCheckTimer);
                return;
            }
            applyQuality(currentQuality);
        }, 1000);

        // ========================================================
        // Listen for SendDuiMessage from FiveM Client Lua
        // ========================================================
        window.addEventListener('message', (event) => {
            let data = event.data;
            if (typeof data === 'string') {
                try { data = JSON.parse(data); } catch (e) {}
            }
            if (!data || !data.action) return;

            console.log("[Wrapper] Received message from FiveM:", JSON.stringify(data));

            // Dynamic Volume Adjustment (Real-time Slider updates)
            if (data.action === "setVolume" && data.volume !== undefined) {
                const vol = Math.max(0, Math.min(100, parseInt(data.volume, 10)));
                if (player) {
                    player.setVolume(vol / 100);
                    if (vol <= 0) {
                        player.setMuted(true);
                    } else {
                        player.setMuted(false);
                    }
                    console.log("[Wrapper] Volume adjusted to:", vol, "%");
                }
            }

            // Dynamic Quality Change
            if (data.action === "setQuality" && data.quality) {
                currentQuality = data.quality.trim().toLowerCase();
                hasQualityLocked = false;
                applyQuality(currentQuality);
            }

            // Dynamic Channel Change
            if (data.action === "setChannel" && data.channel) {
                hasQualityLocked = false;
                if (player) {
                    player.setChannel(data.channel.trim());
                }
            }
        });
    </script>
</body>
</html>
