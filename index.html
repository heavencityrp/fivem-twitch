<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitch Broadcast Overlay</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Twitch Interactive Player API -->
    <script src="https://player.twitch.tv/js/embed/v1.js"></script>
</head>
<body>
    <div id="twitch-container" class="twitch-widget pos-top-right size-medium hidden">
        <!-- Broadcast Header Bar (Drag Header to Move in Edit Mode) -->
        <div id="twitch-header" class="widget-header">
            <div class="header-left">
                <span class="twitch-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="#a970ff">
                        <path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/>
                    </svg>
                </span>
                <span id="live-indicator" class="live-indicator">
                    <span class="pulsing-dot"></span>
                    LIVE
                </span>
                <span id="channel-title" class="channel-title">Twitch Stream</span>
            </div>
            <div class="header-right">
                <span id="broadcast-badge" class="broadcast-badge">SERVER BROADCAST</span>
                <span id="edit-mode-badge" class="edit-badge hidden">✏️ DRAG TO MOVE</span>
            </div>
        </div>

        <!-- Video Player Frame Container -->
        <div id="twitch-body" class="widget-body">
            <div id="player-frame-container" class="player-wrapper">
                <!-- Video player injected dynamically -->
            </div>

            <!-- Offline / Status Overlay Overlay -->
            <div id="stream-status-overlay" class="status-overlay hidden">
                <div class="status-content">
                    <span class="status-icon">📺</span>
                    <h4 id="status-title">Stream Offline</h4>
                    <p id="status-desc">This channel is currently not live on Twitch.</p>
                </div>
            </div>

            <!-- Resize Drag Handle (Visible in Edit Mode) -->
            <div id="resize-handle" class="resize-handle hidden" title="Drag to Resize Window">
                <span>⤡</span>
            </div>

            <!-- Admin Mouse Control Toolbar (Visible in Edit Mode) -->
            <div id="admin-toolbar" class="admin-toolbar hidden">
                <div class="toolbar-row">
                    <!-- Opacity Drag Slider -->
                    <div class="slider-group">
                        <span class="slider-label">Opacity:</span>
                        <input type="range" id="opacity-slider" class="drag-slider" min="0" max="100" value="100">
                        <span id="opacity-val" class="slider-val">100%</span>
                    </div>

                    <!-- Volume Drag Slider -->
                    <div class="slider-group">
                        <span class="slider-label">Volume:</span>
                        <input type="range" id="volume-slider" class="drag-slider" min="0" max="100" value="30">
                        <span id="volume-val" class="slider-val">30%</span>
                    </div>

                    <!-- Exit Edit Mode Button -->
                    <button id="btn-exit-edit" class="btn-exit-edit" title="Exit Mouse Edit Mode (ESC)">
                        Done (ESC)
                    </button>
                </div>
                <div class="toolbar-hint">
                    <span>✢ Drag header to move</span>
                    <span>⤡ Drag corner to resize</span>
                    <span>🎚️ Drag sliders for opacity/volume</span>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
