<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Stream Wrapper (Twitch & YouTube)</title>
    <!-- Twitch Interactive Player API -->
    <script src="https://player.twitch.tv/js/embed/v1.js"></script>
    <!-- YouTube IFrame Player API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: #000;
            overflow: hidden;
        }

        body,
        html,
        #player-container {
            width: 100%;
            height: 100%;
        }

        iframe {
            width: 100% !important;
            height: 100% !important;
            border: none !important;
            display: block !important;
        }
    </style>
</head>

<body>
    <div id="player-container"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);

        // Platform detection: "twitch" or "youtube" (defaults to YouTube if opened directly)
        let platform = (urlParams.get('platform') || '').trim().toLowerCase();
        const rawChannel = (urlParams.get('channel') || '').trim();
        const rawId = (urlParams.get('id') || urlParams.get('videoId') || '').trim();

        if (!platform) {
            if (rawId) {
                platform = 'youtube';
            } else if (rawChannel) {
                platform = 'twitch';
            } else {
                // Default when opened in browser without query parameters:
                platform = 'youtube';
            }
        }

        const initialVolume = Math.max(0, Math.min(100, parseInt(urlParams.get('volume') || '30', 10)));
        const isInitiallyMuted = urlParams.get('muted') === 'true' || initialVolume <= 0;
        let currentQuality = (urlParams.get('quality') || (platform === 'youtube' ? '144p' : '160p')).trim().toLowerCase();

        // Loop control for YouTube (defaults to true)
        let isLoopEnabled = urlParams.get('loop') !== 'false' && urlParams.get('loop') !== '0';

        let twitchPlayer = null;
        let ytPlayer = null;
        let hasQualityLocked = false;

        // Helper to extract 11-char YouTube ID from url or raw string
        function extractYouTubeId(urlOrId) {
            if (!urlOrId) return '';
            const match1 = urlOrId.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
            if (match1) return match1[1];
            const match2 = urlOrId.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);
            if (match2) return match2[1];
            const match3 = urlOrId.match(/youtube\.com\/(?:live|embed|shorts)\/([a-zA-Z0-9_-]{11})/);
            if (match3) return match3[1];
            if (urlOrId.length === 11) return urlOrId;
            return urlOrId;
        }

        // ========================================================
        // 1. YOUTUBE PLAYER & 144p QUALITY MAPPING
        // ========================================================
        function mapYouTubeQuality(q) {
            if (!q) return 'tiny';
            q = q.trim().toLowerCase();
            if (q === '144p' || q === '144' || q === 'tiny' || q === 'lowest' || q === '160p') return 'tiny'; // 144p in YouTube API is "tiny"
            if (q === '240p' || q === '240' || q === 'small') return 'small';
            if (q === '360p' || q === '360' || q === 'medium') return 'medium';
            if (q === '480p' || q === '480' || q === 'large') return 'large';
            if (q === '720p' || q === '720' || q === 'hd720') return 'hd720';
            if (q === '1080p' || q === '1080' || q === 'hd1080') return 'hd1080';
            return 'default';
        }

        function applyYouTubeQuality(q) {
            if (!ytPlayer) return;
            const targetQ = mapYouTubeQuality(q);
            try {
                if (typeof ytPlayer.setPlaybackQuality === 'function') {
                    ytPlayer.setPlaybackQuality(targetQ);
                    console.log("[Wrapper] YouTube setPlaybackQuality called with:", targetQ);
                }
                if (typeof ytPlayer.setPlaybackQualityRange === 'function') {
                    ytPlayer.setPlaybackQualityRange(targetQ, targetQ);
                }
            } catch (e) {
                console.error("[Wrapper] Error setting YouTube quality:", e);
            }
        }

        let ytIframe = null;

        function initYouTube(videoId) {
            console.log("[Wrapper] Initializing YouTube Player for video/live ID:", videoId, "Quality:", currentQuality, "Loop:", isLoopEnabled);

            const container = document.getElementById('player-container');
            container.innerHTML = '';

            // Construct explicit iframe with strict referrer policy, nocookie domain & security permissions to prevent Error 153
            ytIframe = document.createElement('iframe');
            ytIframe.id = 'yt-player-frame';
            ytIframe.width = '100%';
            ytIframe.height = '100%';
            ytIframe.frameBorder = '0';
            ytIframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
            ytIframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
            ytIframe.setAttribute('allowfullscreen', 'true');
            ytIframe.style.cssText = 'width: 100% !important; height: 100% !important; border: none !important; display: block !important;';

            // Parameters for autoplay, looping, volume & API control
            const loopParam = isLoopEnabled ? `&loop=1&playlist=${videoId}` : '';
            const muteParam = isInitiallyMuted ? '&mute=1' : '';

            // Use official www.youtube.com domain so YouTube counts views & concurrent live stream viewers
            const originHost = (window.location.origin && window.location.origin.startsWith('http'))
                ? window.location.origin
                : 'https://www.youtube.com';

            ytIframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&enablejsapi=1&controls=0&disablekb=1&fs=0&modestbranding=1&rel=0&playsinline=1&iv_load_policy=3${loopParam}${muteParam}&origin=${encodeURIComponent(originHost)}&widget_referrer=${encodeURIComponent(originHost)}`;

            container.appendChild(ytIframe);

            // Hook YouTube IFrame API to existing iframe for programmatic volume & quality control
            const hookApi = () => {
                if (window.YT && window.YT.Player && !ytPlayer) {
                    try {
                        ytPlayer = new YT.Player('yt-player-frame', {
                            events: {
                                onReady: function (event) {
                                    console.log("[Wrapper] YouTube Player READY. Applying initial volume:", initialVolume);
                                    if (isInitiallyMuted) {
                                        event.target.mute();
                                    } else {
                                        event.target.unMute();
                                        event.target.setVolume(initialVolume);
                                    }
                                    applyYouTubeQuality(currentQuality);
                                    event.target.playVideo();
                                },
                                onStateChange: function (event) {
                                    if (event.data === YT.PlayerState.PLAYING) {
                                        applyYouTubeQuality(currentQuality);
                                    }
                                    if (event.data === YT.PlayerState.ENDED) {
                                        if (isLoopEnabled) {
                                            console.log("[Wrapper] YouTube video ended. Loop active -> restarting video...");
                                            event.target.seekTo(0);
                                            event.target.playVideo();
                                        }
                                    }
                                },
                                onError: function (event) {
                                    console.error("[Wrapper] YouTube error code:", event.data);
                                }
                            }
                        });
                    } catch (err) {
                        console.error("[Wrapper] Failed to hook YT.Player:", err);
                    }
                }
            };

            window.onYouTubeIframeAPIReady = hookApi;
            if (window.YT && window.YT.Player) {
                hookApi();
            }

            // Human engagement simulator to help YouTube validate active playback in headless CEF
            let engagementTimer = setInterval(() => {
                try {
                    window.focus();
                    if (ytIframe && document.activeElement !== ytIframe) {
                        ytIframe.focus();
                    }
                    const evt = new MouseEvent('mousemove', {
                        view: window,
                        bubbles: true,
                        cancelable: true,
                        clientX: 150 + Math.floor(Math.random() * 200),
                        clientY: 150 + Math.floor(Math.random() * 200)
                    });
                    document.dispatchEvent(evt);
                } catch (e) { }
            }, 10000);

            // Quality loop checker for initial buffering
            let ytChecks = 0;
            const ytTimer = setInterval(() => {
                ytChecks++;
                if (ytChecks > 10) {
                    clearInterval(ytTimer);
                    return;
                }
                applyYouTubeQuality(currentQuality);
            }, 1000);
        }

        // ========================================================
        // 2. TWITCH PLAYER INITIALIZATION
        // ========================================================
        function initTwitch(channel) {
            console.log("[Wrapper] Initializing Twitch Player for channel:", channel);
            const host = window.location.hostname || 'heavencityrp.github.io';

            const options = {
                width: "100%",
                height: "100%",
                channel: channel,
                parent: [host, "localhost", "127.0.0.1"],
                autoplay: true,
                muted: isInitiallyMuted
            };

            try {
                twitchPlayer = new Twitch.Player("player-container", options);
            } catch (err) {
                console.error("[Wrapper] Failed to initialize Twitch.Player:", err);
                return;
            }

            twitchPlayer.addEventListener(Twitch.Player.READY, () => {
                console.log("[Wrapper] Twitch Player READY. Initial volume:", initialVolume);
                twitchPlayer.setVolume(initialVolume / 100);
                if (isInitiallyMuted) {
                    twitchPlayer.setMuted(true);
                } else {
                    twitchPlayer.setMuted(false);
                }
            });

            twitchPlayer.addEventListener(Twitch.Player.PLAYING, () => {
                if (!hasQualityLocked) {
                    applyTwitchQuality(currentQuality);
                }
            });

            let checks = 0;
            const timer = setInterval(() => {
                checks++;
                if (hasQualityLocked || checks > 15) {
                    clearInterval(timer);
                    return;
                }
                applyTwitchQuality(currentQuality);
            }, 1000);
        }

        function applyTwitchQuality(targetQuality) {
            if (!twitchPlayer || typeof twitchPlayer.getQualities !== 'function') return;

            try {
                const qualities = twitchPlayer.getQualities();
                if (!qualities || qualities.length === 0) return;

                if (targetQuality === "160p" || targetQuality === "lowest" || targetQuality === "144p") {
                    let qMatch = qualities.find(q => q.group && q.group.toLowerCase().includes("160"));
                    if (!qMatch) {
                        const validQualities = qualities.filter(q => q.group && q.group !== "auto");
                        if (validQualities.length > 0) {
                            qMatch = validQualities[validQualities.length - 1];
                        }
                    }
                    if (qMatch) {
                        twitchPlayer.setQuality(qMatch.group);
                        hasQualityLocked = true;
                        console.log("[Wrapper] Twitch quality locked to:", qMatch.group);
                    }
                } else if (targetQuality && targetQuality !== "auto") {
                    const match = qualities.find(q => q.group && q.group.toLowerCase().includes(targetQuality));
                    if (match) {
                        twitchPlayer.setQuality(match.group);
                        hasQualityLocked = true;
                    }
                } else if (targetQuality === "auto") {
                    twitchPlayer.setQuality("auto");
                    hasQualityLocked = true;
                }
            } catch (e) {
                console.error("[Wrapper] Error setting Twitch quality:", e);
            }
        }

        // ========================================================
        // ROUTE INITIALIZATION
        // ========================================================
        if (platform === 'youtube') {
            const ytId = extractYouTubeId(rawId || rawChannel || 'ai_bE3G0vY0');
            initYouTube(ytId);
        } else {
            const twChannel = (rawChannel || rawId || 'asaulter98').trim();
            initTwitch(twChannel);
        }

        // ========================================================
        // 3. LISTEN FOR FiveM DUI MESSAGES
        // ========================================================
        window.addEventListener('message', (event) => {
            let data = event.data;
            if (typeof data === 'string') {
                try { data = JSON.parse(data); } catch (e) { }
            }
            if (!data || !data.action) return;

            console.log("[Wrapper] Message from FiveM:", JSON.stringify(data));

            // Dynamic Volume Adjustment
            if (data.action === "setVolume" && data.volume !== undefined) {
                const vol = Math.max(0, Math.min(100, parseInt(data.volume, 10)));

                if (twitchPlayer) {
                    twitchPlayer.setVolume(vol / 100);
                    if (vol <= 0) {
                        twitchPlayer.setMuted(true);
                    } else {
                        twitchPlayer.setMuted(false);
                    }
                }

                if (ytPlayer && typeof ytPlayer.setVolume === 'function') {
                    if (vol <= 0) {
                        ytPlayer.mute();
                    } else {
                        ytPlayer.unMute();
                        ytPlayer.setVolume(vol);
                    }
                } else if (ytIframe && ytIframe.contentWindow) {
                    try {
                        ytIframe.contentWindow.postMessage(JSON.stringify({
                            event: 'command',
                            func: vol <= 0 ? 'mute' : 'unMute'
                        }), '*');
                        ytIframe.contentWindow.postMessage(JSON.stringify({
                            event: 'command',
                            func: 'setVolume',
                            args: [vol]
                        }), '*');
                    } catch (e) { }
                }
            }

            // Dynamic Quality Adjustment (Supports 144p for YouTube, 160p for Twitch)
            if (data.action === "setQuality" && data.quality) {
                currentQuality = data.quality.trim().toLowerCase();
                hasQualityLocked = false;
                if (twitchPlayer) {
                    applyTwitchQuality(currentQuality);
                }
                if (ytPlayer) {
                    applyYouTubeQuality(currentQuality);
                }
            }

            // Dynamic Loop Adjustment for YouTube
            if (data.action === "setLoop" && data.loop !== undefined) {
                isLoopEnabled = (data.loop === true || data.loop === 'true' || data.loop === 1);
                console.log("[Wrapper] YouTube loop updated via message to:", isLoopEnabled);
            }

            // Stop Video Playback
            if (data.action === "stop") {
                if (twitchPlayer && typeof twitchPlayer.pause === 'function') {
                    twitchPlayer.pause();
                }
                if (ytPlayer && typeof ytPlayer.stopVideo === 'function') {
                    ytPlayer.stopVideo();
                }
            }
        });
    </script>
</body>

</html>
